<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">Expense Tracker</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- MAIN CONTENT -->
  <div class="dashboard">
    <h1 id="page-title">Dashboard</h1>

    <div class="profile-card">
      <div class="profile-header">
        <h1 id="welcome-text">Welcome 👋</h1>
        <button id="edit-btn" onclick="toggleEdit()">Edit Name</button>
      </div>

      <div id="edit-section" class="edit-section hidden">
        <input type="text" id="profile-name" placeholder="Enter your name" />
        <button onclick="updateProfile()">Save</button>
      </div>

      <p id="profile-message"></p>
    </div>

    <div class="cards">
      <div class="card">
        <h3>Total Income</h3>
        <p id="total-income">₹0</p>
      </div>

      <div class="card">
        <h3>Total Expense</h3>
        <p id="total-expense">₹0</p>
      </div>

      <div class="card balance">
        <h3>Balance</h3>
        <p id="balance">₹0</p>
      </div>
    </div>

    <!-- FILTER AND EXPORT SECTION -->
    <div class="action-buttons">
      <button id="filter-btn" onclick="toggleFilters()" class="filter-btn">
        🔍 Filters
        <span id="filter-badge" class="filter-badge hidden">0</span>
      </button>

      <div class="export-buttons">
        <button onclick="exportToCSV()" class="export-btn export-csv">
          📊 Export CSV
        </button>
        <button onclick="exportToPDF()" class="export-btn export-pdf">
          📄 Export PDF
        </button>
      </div>
    </div>

    <!-- FILTER SECTION -->
    <section class="filter-card hidden" id="filter-section">
      <h3>Filter Transactions</h3>

      <div class="filter-grid">
        <div class="filter-group">
          <label for="filter-from-date">From Date</label>
          <input type="date" id="filter-from-date" onchange="handleFilterChange()" />
        </div>

        <div class="filter-group">
          <label for="filter-to-date">To Date</label>
          <input type="date" id="filter-to-date" onchange="handleFilterChange()" />
        </div>

        <div class="filter-group">
          <label for="filter-category">Category</label>
          <select id="filter-category" onchange="handleFilterChange()">
            <option value="">All Categories</option>

            <optgroup label="Income">
              <option>Salary</option>
              <option>Bonus</option>
              <option>Business Profit</option>
              <option>Freelance and Contract</option>
              <option>Rental Income</option>
              <option>Dividends and Interest</option>
              <option>Gifts Received</option>
              <option>Refunds</option>
              <option>Sale of Items</option>
            </optgroup>

            <optgroup label="Food and Drinks">
              <option>Groceries</option>
              <option>Fruits</option>
              <option>Restaurant and Dining</option>
              <option>Fast Food</option>
              <option>Snacks</option>
              <option>Coffee and Tea</option>
              <option>Food Delivery</option>
              <option>Alcohol and Bars</option>
              <option>Dietary Supplements</option>
            </optgroup>

            <optgroup label="Housing and Utilities">
              <option>Rent</option>
              <option>Mortgage</option>
              <option>Property Tax</option>
              <option>Home Insurance</option>
              <option>Electricity</option>
              <option>DTH</option>
              <option>Water</option>
              <option>Gas and Heating</option>
              <option>Internet and WiFi</option>
              <option>Cable TV</option>
              <option>Mobile Recharge</option>
              <option>Maintenance and Repairs</option>
              <option>Furniture and Decor</option>
              <option>Cleaning Services</option>
              <option>HOA Fees</option>
              <option>Garden and Lawn</option>
            </optgroup>

            <optgroup label="Transport">
              <option>Fuel</option>
              <option>Car Loan and Lease</option>
              <option>Vehicle Insurance</option>
              <option>Vehicle Maintenance</option>
              <option>Public Transport</option>
              <option>Taxi and Cab</option>
              <option>Parking</option>
              <option>Tolls</option>
              <option>Car Wash</option>
              <option>Registration Fees</option>
            </optgroup>

            <optgroup label="Shopping">
              <option>Clothing</option>
              <option>Footwear</option>
              <option>Accessories</option>
              <option>Electronics</option>
              <option>Beauty and Cosmetics</option>
              <option>Jewelry</option>
              <option>Sporting Goods</option>
              <option>Hobbies</option>
              <option>Online Shopping</option>
            </optgroup>

            <optgroup label="Health and Medical">
              <option>Doctor</option>
              <option>Dentist</option>
              <option>Eye Care</option>
              <option>Pharmacy</option>
              <option>Hospital Bill</option>
              <option>Health Insurance</option>
              <option>GYM</option>
              <option>Mental Health</option>
              <option>Wellness and Spa</option>
            </optgroup>

            <optgroup label="Family and Kids">
              <option>Family</option>
              <option>Childcare</option>
              <option>School Fees</option>
              <option>Tuition</option>
              <option>School Supplies</option>
              <option>Toys and Games</option>
              <option>Baby Supplies</option>
              <option>Child Support</option>
              <option>Elder Care</option>
            </optgroup>

            <optgroup label="Education">
              <option>Books</option>
              <option>Online Courses</option>
              <option>University Fees</option>
              <option>Student Loan</option>
              <option>Certifications</option>
              <option>Seminars</option>
            </optgroup>

            <optgroup label="Tech and Subscription">
              <option>Software</option>
              <option>Mobile Apps</option>
              <option>Cloud Storage</option>
              <option>VPN and Antivirus</option>
              <option>Hosting</option>
            </optgroup>

            <optgroup label="Entertainment">
              <option>Movies</option>
              <option>Streaming Subscription</option>
              <option>Music</option>
              <option>Video Games</option>
              <option>Concerts and Events</option>
              <option>Nightlife</option>
              <option>Sports Matches</option>
              <option>Lottery</option>
            </optgroup>

            <optgroup label="Travel">
              <option>Flights</option>
              <option>Train</option>
              <option>Hotels</option>
              <option>Travel Food</option>
              <option>Sightseeing</option>
              <option>Visa Fees</option>
              <option>Travel Insurance</option>
              <option>Souvenirs</option>
            </optgroup>

            <optgroup label="Financial">
              <option>Credit Card Payment</option>
              <option>EMI</option>
              <option>Bank Charges</option>
              <option>Investments</option>
              <option>Savings Transfer</option>
              <option>Life Insurance</option>
              <option>Income Tax</option>
              <option>Fines</option>
              <option>Legal Fees</option>
              <option>Accounting Fees</option>
            </optgroup>

            <optgroup label="Personal and Misc">
              <option>Personal Care</option>
              <option>Salon</option>
              <option>Laundry</option>
              <option>Gifts Given</option>
              <option>Donations</option>
              <option>Pet Food</option>
              <option>Pet Medical</option>
              <option>Religious Expenses</option>
              <option>Office Supplies</option>
              <option>Shipping</option>
              <option>Lost Items</option>
              <option>Emergency Fund</option>
              <option>Other</option>
            </optgroup>
          </select>
        </div>
      </div>

      <div class="filter-actions">
        <button onclick="clearFilters()" class="clear-filter-btn">
          Clear All Filters
        </button>
      </div>
    </section>

    <div class="add-toggle">
      <button id="toggle-expense-btn" onclick="toggleExpenseForm()">
        ➕ Add Expense / Income
      </button>
    </div>

    <section class="expense-card hidden" id="expense-section">
      <button class="close-expense-btn" onclick="toggleExpenseForm()">✖</button>

      <h2>Add Transaction</h2>

      <form id="expense-form">

        <div class="form-group">
          <label for="expense-type">Type</label>
          <select id="expense-type" required>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>

        <div class="form-group">
          <label for="expense-title">Title</label>
          <input type="text" id="expense-title" placeholder="e.g. Grocery" required />
        </div>

        <div class="form-group">
          <label for="expense-amount">Amount (₹)</label>
          <input type="number" id="expense-amount" placeholder="e.g. 500" required step="0.01" min="0" />
        </div>

        <div class="form-group">
          <label for="expense-category">Category</label>
          <select id="expense-category" required>
            <option value="">Select category</option>

            <optgroup label="Income">
              <option>Salary</option>
              <option>Bonus</option>
              <option>Business Profit</option>
              <option>Freelance and Contract</option>
              <option>Rental Income</option>
              <option>Dividends and Interest</option>
              <option>Gifts Received</option>
              <option>Refunds</option>
              <option>Sale of Items</option>
            </optgroup>

            <optgroup label="Food and Drinks">
              <option>Groceries</option>
              <option>Fruits</option>
              <option>Restaurant and Dining</option>
              <option>Fast Food</option>
              <option>Snacks</option>
              <option>Coffee and Tea</option>
              <option>Food Delivery</option>
              <option>Alcohol and Bars</option>
              <option>Dietary Supplements</option>
            </optgroup>

            <optgroup label="Housing and Utilities">
              <option>Rent</option>
              <option>Mortgage</option>
              <option>Property Tax</option>
              <option>Home Insurance</option>
              <option>Electricity</option>
              <option>DTH</option>
              <option>Water</option>
              <option>Gas and Heating</option>
              <option>Internet and WiFi</option>
              <option>Cable TV</option>
              <option>Mobile Recharge</option>
              <option>Maintenance and Repairs</option>
              <option>Furniture and Decor</option>
              <option>Cleaning Services</option>
              <option>HOA Fees</option>
              <option>Garden and Lawn</option>
            </optgroup>

            <optgroup label="Transport">
              <option>Fuel</option>
              <option>Car Loan and Lease</option>
              <option>Vehicle Insurance</option>
              <option>Vehicle Maintenance</option>
              <option>Public Transport</option>
              <option>Taxi and Cab</option>
              <option>Parking</option>
              <option>Tolls</option>
              <option>Car Wash</option>
              <option>Registration Fees</option>
            </optgroup>

            <optgroup label="Shopping">
              <option>Clothing</option>
              <option>Footwear</option>
              <option>Accessories</option>
              <option>Electronics</option>
              <option>Beauty and Cosmetics</option>
              <option>Jewelry</option>
              <option>Sporting Goods</option>
              <option>Hobbies</option>
              <option>Online Shopping</option>
            </optgroup>

            <optgroup label="Health and Medical">
              <option>Doctor</option>
              <option>Dentist</option>
              <option>Eye Care</option>
              <option>Pharmacy</option>
              <option>Hospital Bill</option>
              <option>Health Insurance</option>
              <option>GYM</option>
              <option>Mental Health</option>
              <option>Wellness and Spa</option>
            </optgroup>

            <optgroup label="Family and Kids">
              <option>Family</option>
              <option>Childcare</option>
              <option>School Fees</option>
              <option>Tuition</option>
              <option>School Supplies</option>
              <option>Toys and Games</option>
              <option>Baby Supplies</option>
              <option>Child Support</option>
              <option>Elder Care</option>
            </optgroup>

            <optgroup label="Education">
              <option>Books</option>
              <option>Online Courses</option>
              <option>University Fees</option>
              <option>Student Loan</option>
              <option>Certifications</option>
              <option>Seminars</option>
            </optgroup>

            <optgroup label="Tech and Subscription">
              <option>Software</option>
              <option>Mobile Apps</option>
              <option>Cloud Storage</option>
              <option>VPN and Antivirus</option>
              <option>Hosting</option>
            </optgroup>

            <optgroup label="Entertainment">
              <option>Movies</option>
              <option>Streaming Subscription</option>
              <option>Music</option>
              <option>Video Games</option>
              <option>Concerts and Events</option>
              <option>Nightlife</option>
              <option>Sports Matches</option>
              <option>Lottery</option>
            </optgroup>

            <optgroup label="Travel">
              <option>Flights</option>
              <option>Train</option>
              <option>Hotels</option>
              <option>Travel Food</option>
              <option>Sightseeing</option>
              <option>Visa Fees</option>
              <option>Travel Insurance</option>
              <option>Souvenirs</option>
            </optgroup>

            <optgroup label="Financial">
              <option>Credit Card Payment</option>
              <option>EMI</option>
              <option>Bank Charges</option>
              <option>Investments</option>
              <option>Savings Transfer</option>
              <option>Life Insurance</option>
              <option>Income Tax</option>
              <option>Fines</option>
              <option>Legal Fees</option>
              <option>Accounting Fees</option>
            </optgroup>

            <optgroup label="Personal and Misc">
              <option>Personal Care</option>
              <option>Salon</option>
              <option>Laundry</option>
              <option>Gifts Given</option>
              <option>Donations</option>
              <option>Pet Food</option>
              <option>Pet Medical</option>
              <option>Religious Expenses</option>
              <option>Office Supplies</option>
              <option>Shipping</option>
              <option>Lost Items</option>
              <option>Emergency Fund</option>
              <option>Other</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group">
          <label for="expense-date">Date</label>
          <input type="date" id="expense-date" required/>
        </div>

        <button type="submit" class="add-btn" id="save-expense-btn">Add Transaction</button>
      </form>

    </section>

    <section class="expense-list">
      <h2>Recent Transactions</h2>

      <table id="expense-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Date</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expense-body">
          <!-- rows injected by JS -->
        </tbody>
      </table>
    </section>

  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/home.js"></script>

</body>

</html>
